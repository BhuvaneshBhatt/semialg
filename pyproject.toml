[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "semialg"
version = "0.1.0"
description = "CAD and real semialgebraic reasoning for Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["sympy>=1.12"]
authors = [{name = "Bhuvanesh Bhatt", email = "bhuvaneshbhatt@gmail.com"}]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "matplotlib>=3.8",
]
dev = [
  "pytest>=8",
  "matplotlib>=3.8",
  "ruff>=0.4",
  "nbformat>=5",
]
notebooks = [
  "matplotlib>=3.8",
  "jupyter>=1",
]
release = [
  "build>=1.2",
  "twine>=6",
]

[project.scripts]
semialg = "semialg.cli:main"

[project.urls]
Homepage = "https://github.com/BhuvaneshBhatt/semialg"
Repository = "https://github.com/BhuvaneshBhatt/semialg"
Issues = "https://github.com/BhuvaneshBhatt/semialg/issues"
Documentation = "https://github.com/BhuvaneshBhatt/semialg/tree/main/docs"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["semialg*"]

[tool.ruff]
line-length = 100
exclude = [
    "notebooks",
    ".git",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: computationally expensive tests"]
