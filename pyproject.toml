[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "semialg"
version = "1.1.0"
description = "Exact real algebraic and semialgebraic geometry in Python: CAD, quantifier elimination, semialgebraic solving, decomposition, integration, and measure"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["sympy>=1.12", "python-flint>=0.9.0", "exprtest>=0.1.0"]
authors = [{name = "Bhuvanesh Bhatt", email = "bhuvaneshbhatt@gmail.com"}]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
keywords = [
  "symbolic mathematics",
  "computer algebra",
  "semialgebraic geometry",
  "real algebraic geometry",
  "cylindrical algebraic decomposition",
  "CAD",
  "quantifier elimination",
  "polynomial systems",
  "real root isolation",
  "exact computation",
  "certified computation",
  "symbolic integration",
  "semialgebraic optimization",
  "SymPy",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "matplotlib>=3.8",
  "nbformat>=5",
  "nbclient>=0.10",
  "ipykernel>=6",
  "PyYAML>=6",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "matplotlib>=3.8",
  "ruff>=0.4",
  "nbformat>=5",
  "nbclient>=0.10",
  "ipykernel>=6",
  "PyYAML>=6",
]
docs = [
  "mkdocs>=1.6",
]
notebooks = [
  "matplotlib>=3.8",
  "jupyter>=1",
  "nbclient>=0.10",
  "ipykernel>=6",
]
release = [
  "build>=1.2",
  "twine>=6",
]

[project.scripts]
semialg = "semialg.cli:main"

[project.urls]
Homepage = "https://github.com/BhuvaneshBhatt/semialg"
Repository = "https://github.com/BhuvaneshBhatt/semialg"
Issues = "https://github.com/BhuvaneshBhatt/semialg/issues"
Documentation = "https://github.com/BhuvaneshBhatt/semialg/tree/main/docs"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["semialg*"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    "notebooks",
    ".git",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE001", "PIE790", "RUF059", "RUF068"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/semialg/algebraic/border_basis.py" = ["E402"]
"src/semialg/algebraic/subresultants.py" = ["E402"]
"src/semialg/optimization.py" = ["E402"]
"src/semialg/region_integrate.py" = ["E402"]
"src/semialg/symbol_resolution.py" = ["E402"]
"tests/test_generated_advanced_edge_invariants.py" = ["E402"]
"tests/test_generated_convexity_invariants.py" = ["E402"]
"tests/test_generated_deep_mathematical_invariants.py" = ["E402"]
"tests/test_semialgebraic_properties.py" = ["E402"]
"tests/properties/test_region_metamorphic.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = '-ra -m "not slow"'
markers = [
  "contract: public API and permanent behavioral contract tests",
  "documentation: README, documentation, example, and notebook tests",
  "integration: subsystem and cross-subsystem behavioral tests",
  "property: generated and meatmorphic mathematical property tests",
  "wheel: contracts that exercise a built or installed distribution",
  "slow: computationally expensive tests excluded from the default suite",
  "performance: opt-in wall-clock regression tests (also marked slow)",
  "installed_wheel: release contracts executed against an installed wheel",
]

[tool.coverage.run]
branch = true
source = ["semialg"]

[tool.coverage.report]
fail_under = 74.5
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
